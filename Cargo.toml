[workspace]
resolver = "2"
members = [
    "crates/f2f-core",
    "crates/f2f-capture",
    "crates/f2f-store",
    "crates/f2f-cli",
]
exclude = ["examples/broken-rust-project"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Bibhabendu Mukherjee <mukherjee4004@gmail.com>"]
repository = "https://github.com/bmtai-projects/failure2fixture"
publish = false

[workspace.dependencies]
f2f-core = { path = "crates/f2f-core" }
f2f-capture = { path = "crates/f2f-capture" }
f2f-store = { path = "crates/f2f-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ulid = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
